<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code &amp; Blossom — Memory Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #FFF8FB;
    --bg-bottom: #F3ECFA;
    --card-back-a: #FFD1DC;
    --card-back-b: #D8C9F0;
    --card-front: #FFFFFF;
    --accent: #B983C4;
    --accent-soft: #C1F0F6;
    --success: #9FE6B8;
    --success-soft: #E4FBEC;
    --text: #6B4C7A;
    --muted: #A68FB8;
    --shadow: rgba(185, 131, 196, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    padding: 32px 16px;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }

  h1 span {
    display: inline-block;
  }

  .subtitle {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .pill {
    background: #ffffffb0;
    border: 1px solid var(--accent-soft);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 10px var(--shadow);
  }

  .pill b {
    color: var(--accent);
    font-weight: 700;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .card {
    aspect-ratio: 1 / 1;
    perspective: 700px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(.2,.9,.3,1.2);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
  }

  .face.back {
    background: linear-gradient(135deg, var(--card-back-a), var(--card-back-b));
    box-shadow: 0 6px 14px var(--shadow);
  }

  .face.back::after {
    content: "✨";
    font-size: 20px;
    opacity: 0.85;
  }

  .face.front {
    background: var(--card-front);
    transform: rotateY(180deg);
    font-size: 30px;
    border: 2px solid var(--accent-soft);
  }

  .card.matched .face.front {
    background: var(--success-soft);
    border-color: var(--success);
  }

  .card.matched .card-inner {
    animation: pop 0.35s ease;
  }

  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.08); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  button.restart {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    background: #ffffffc0;
    border: 1px solid var(--accent-soft);
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    box-shadow: 0 4px 10px var(--shadow);
    transition: transform 0.15s ease;
  }

  button.restart:hover { transform: translateY(-1px); }
  button.restart:active { transform: translateY(0px) scale(0.98); }

  .back-link {
    display: block;
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
  }

  .back-link:hover { color: var(--accent); }

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(107, 76, 122, 0.25);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .win-overlay.show {
    display: flex;
  }

  .win-card {
    background: var(--card-front);
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 12px 30px rgba(107, 76, 122, 0.35);
  }

  .win-card .emoji-row {
    font-size: 26px;
    margin-bottom: 8px;
  }

  .win-card h2 {
    margin: 0 0 6px;
    font-size: 20px;
  }

  .win-card p {
    margin: 0 0 18px;
    font-size: 14px;
    color: var(--muted);
  }

  @media (max-width: 380px) {
    .board { gap: 8px; }
    .face.front { font-size: 24px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <h1><span>🌸 Code &amp; Blossom</span></h1>
    <p class="subtitle">a little memory match, built with the same tech I use daily</p>

    <div class="stats">
      <div class="pill">Moves: <b id="moves">0</b></div>
      <div class="pill">Time: <b id="time">0s</b></div>
      <div class="pill">Best: <b id="best">—</b></div>
    </div>

    <div class="board" id="board"></div>

    <button class="restart" id="restartBtn">🔁 Play Again</button>
    <a class="back-link" href="../">← back to profile</a>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <div class="emoji-row">🌸🎉🌸</div>
      <h2>All matched!</h2>
      <p id="winSummary">You solved it.</p>
      <button class="restart" id="winRestartBtn">🔁 Play Again</button>
    </div>
  </div>

<script>
  const ICONS = ['🐍', '⚙️', '☕', '🗄️', '🌐', '🧩', '💻', '🌸'];
  const STORAGE_KEY = 'codeBlossomMemoryBest';

  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const restartBtn = document.getElementById('restartBtn');
  const winOverlay = document.getElementById('winOverlay');
  const winRestartBtn = document.getElementById('winRestartBtn');
  const winSummary = document.getElementById('winSummary');

  let deck = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let timerInterval = null;
  let seconds = 0;
  let lockBoard = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function loadBest() {
    try {
      const v = localStorage.getItem(STORAGE_KEY);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  }

  function saveBest(entry) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entry));
    } catch (e) {
      /* storage unavailable, ignore */
    }
  }

  function renderBest() {
    const best = loadBest();
    bestEl.textContent = best ? `${best.moves}mv / ${best.seconds}s` : '—';
  }

  function startTimer() {
    stopTimer();
    seconds = 0;
    timeEl.textContent = '0s';
    timerInterval = setInterval(() => {
      seconds += 1;
      timeEl.textContent = seconds + 's';
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  function buildBoard() {
    deck = shuffle([...ICONS, ...ICONS]);
    matchedCount = 0;
    moves = 0;
    flipped = [];
    lockBoard = false;
    movesEl.textContent = '0';
    winOverlay.classList.remove('show');
    boardEl.innerHTML = '';

    deck.forEach((icon, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.icon = icon;
      card.dataset.idx = idx;
      card.innerHTML = `
        <div class="card-inner">
          <div class="face back"></div>
          <div class="face front">${icon}</div>
        </div>
      `;
      card.addEventListener('click', () => onCardClick(card));
      boardEl.appendChild(card);
    });

    startTimer();
    renderBest();
  }

  function onCardClick(card) {
    if (lockBoard) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
      moves += 1;
      movesEl.textContent = String(moves);
      checkMatch();
    }
  }

  function checkMatch() {
    const [a, b] = flipped;
    if (a.dataset.icon === b.dataset.icon) {
      a.classList.add('matched');
      b.classList.add('matched');
      flipped = [];
      matchedCount += 1;
      if (matchedCount === ICONS.length) {
        onWin();
      }
    } else {
      lockBoard = true;
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        flipped = [];
        lockBoard = false;
      }, 700);
    }
  }

  function onWin() {
    stopTimer();
    const best = loadBest();
    const isNewBest = !best || moves < best.moves || (moves === best.moves && seconds < best.seconds);
    if (isNewBest) {
      saveBest({ moves, seconds });
    }
    winSummary.textContent = isNewBest
      ? `New best — ${moves} moves in ${seconds}s! 🏆`
      : `${moves} moves in ${seconds}s. Try to beat your best!`;
    renderBest();
    setTimeout(() => winOverlay.classList.add('show'), 400);
  }

  restartBtn.addEventListener('click', buildBoard);
  winRestartBtn.addEventListener('click', buildBoard);

  buildBoard();
</script>

</body>
</html>
