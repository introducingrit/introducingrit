<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code &amp; Blossom — 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #FFF8FB;
    --bg-bottom: #F3ECFA;
    --accent: #B983C4;
    --accent-soft: #C1F0F6;
    --board-bg: #EADCF5;
    --cell-empty: #F8F0FB;
    --text: #6B4C7A;
    --muted: #A68FB8;
    --shadow: rgba(185, 131, 196, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, var(--bg-top), var(--bg-bottom));
    color: var(--text); padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 4px; }
  .subtitle { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0 0 18px; }
  .stats { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .pill { background: #ffffffb0; border: 1px solid var(--accent-soft); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600; box-shadow: 0 4px 10px var(--shadow); }
  .pill b { color: var(--accent); }

  .board-outer {
    background: var(--board-bg); border-radius: 18px; padding: 10px;
    box-shadow: 0 8px 20px var(--shadow); margin-bottom: 16px; touch-action: none;
  }
  .board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .cell-bg {
    aspect-ratio: 1 / 1; background: var(--cell-empty); border-radius: 10px;
  }
  .tiles { position: relative; }
  .tile {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-weight: 700; transition: left 0.12s ease, top 0.12s ease, transform 0.12s ease;
  }

  .status { font-size: 15px; font-weight: 600; margin-bottom: 12px; min-height: 22px; }

  button {
    font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; color: var(--text);
    background: #ffffffc0; border: 1px solid var(--accent-soft); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; box-shadow: 0 4px 10px var(--shadow);
  }
  button:hover { transform: translateY(-1px); }

  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .nav { margin-top: 14px; font-size: 12px; }
  .nav a { color: var(--muted); text-decoration: none; margin: 0 6px; }
  .nav a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🌸 2048</h1>
    <p class="subtitle">swipe or use arrow keys — merge your way to 2048</p>

    <div class="stats">
      <div class="pill">Score: <b id="score">0</b></div>
      <div class="pill">Best: <b id="best">0</b></div>
    </div>

    <div class="board-outer">
      <div class="board" id="boardBg"></div>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="status" id="status"></div>
    <button id="restartBtn">🔁 New Game</button>
    <p class="hint">arrow keys on desktop · swipe on mobile</p>

    <div class="nav">
      <a href="../memory-match/">Memory Match</a> ·
      <a href="../tic-tac-toe/">Tic-Tac-Toe</a> ·
      <a href="../typing-test/">Typing Test</a> ·
      <a href="../">Profile</a>
    </div>
  </div>

<script>
  const SIZE = 4;
  const STORAGE_BEST = 'codeBlossom2048Best';
  const boardBgEl = document.getElementById('boardBg');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restartBtn');

  const TILE_COLORS = {
    2:    { bg: '#FFF3B0', fg: '#6B4C7A' },
    4:    { bg: '#FFE39C', fg: '#6B4C7A' },
    8:    { bg: '#FFD1DC', fg: '#6B4C7A' },
    16:   { bg: '#FFB9CB', fg: '#5a3a68' },
    32:   { bg: '#E6AEE0', fg: '#ffffff' },
    64:   { bg: '#D8A8E8', fg: '#ffffff' },
    128:  { bg: '#C1F0F6', fg: '#3f5e63' },
    256:  { bg: '#9BE0EA', fg: '#1f3a3e' },
    512:  { bg: '#9FE6B8', fg: '#1d4b2e' },
    1024: { bg: '#7FD79E', fg: '#0f3d21' },
    2048: { bg: '#B983C4', fg: '#ffffff' }
  };

  let grid = [];
  let score = 0;
  let cellSize = 0;
  let gap = 8;
  let won = false;
  let gameOver = false;

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function loadBest() {
    try { return parseInt(localStorage.getItem(STORAGE_BEST) || '0', 10); } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(STORAGE_BEST, String(v)); } catch (e) {}
  }

  function buildBackground() {
    boardBgEl.innerHTML = '';
    for (let i = 0; i < SIZE * SIZE; i++) {
      const c = document.createElement('div');
      c.className = 'cell-bg';
      boardBgEl.appendChild(c);
    }
    requestAnimationFrame(measure);
  }

  function measure() {
    const bgCell = boardBgEl.firstElementChild;
    if (!bgCell) return;
    cellSize = bgCell.getBoundingClientRect().width;
    tilesEl.style.position = 'absolute';
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    tilesEl.innerHTML = '';
    tilesEl.style.width = boardBgEl.getBoundingClientRect().width + 'px';
    tilesEl.style.height = boardBgEl.getBoundingClientRect().height + 'px';

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        if (!val) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        const colors = TILE_COLORS[val] || { bg: '#B983C4', fg: '#fff' };
        tile.style.background = colors.bg;
        tile.style.color = colors.fg;
        tile.style.width = cellSize + 'px';
        tile.style.height = cellSize + 'px';
        tile.style.left = c * (cellSize + gap) + 'px';
        tile.style.top = r * (cellSize + gap) + 'px';
        tile.style.fontSize = (val >= 1000 ? 18 : val >= 100 ? 20 : 24) + 'px';
        tile.textContent = val;
        tilesEl.appendChild(tile);
      }
    }
    scoreEl.textContent = score;
    bestEl.textContent = loadBest();
  }

  function cloneGrid(g) { return g.map(row => row.slice()); }
  function gridsEqual(a, b) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (a[r][c] !== b[r][c]) return false;
    return true;
  }

  function compress(row) {
    const filtered = row.filter(v => v !== 0);
    const merged = [];
    let gained = 0;
    for (let i = 0; i < filtered.length; i++) {
      if (filtered[i] === filtered[i + 1]) {
        const val = filtered[i] * 2;
        merged.push(val);
        gained += val;
        if (val === 2048) won = true;
        i++;
      } else {
        merged.push(filtered[i]);
      }
    }
    while (merged.length < SIZE) merged.push(0);
    return { row: merged, gained };
  }

  function rotateGrid(g) {
    const res = emptyGrid();
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        res[c][SIZE - 1 - r] = g[r][c];
    return res;
  }

  function moveLeft(g) {
    let gained = 0;
    const newGrid = g.map(row => {
      const result = compress(row);
      gained += result.gained;
      return result.row;
    });
    return { grid: newGrid, gained };
  }

  function move(direction) {
    if (gameOver) return;
    let g = cloneGrid(grid);
    let rotations = 0;
    if (direction === 'up') rotations = 3;
    else if (direction === 'right') rotations = 2;
    else if (direction === 'down') rotations = 1;

    for (let i = 0; i < rotations; i++) g = rotateGrid(g);
    const { grid: movedGrid, gained } = moveLeft(g);
    let resultGrid = movedGrid;
    for (let i = 0; i < (4 - rotations) % 4; i++) resultGrid = rotateGrid(resultGrid);

    if (!gridsEqual(grid, resultGrid)) {
      grid = resultGrid;
      score += gained;
      if (score > loadBest()) saveBest(score);
      addRandomTile();
      render();
      checkGameOver();
      if (won) {
        statusEl.textContent = '🌸 2048 reached! Keep going or start fresh.';
        won = false;
      }
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
      }
    }
    return false;
  }

  function checkGameOver() {
    if (!canMove()) {
      gameOver = true;
      statusEl.textContent = '💗 No more moves — game over.';
    }
  }

  function restart() {
    grid = emptyGrid();
    score = 0;
    gameOver = false;
    won = false;
    statusEl.textContent = '';
    addRandomTile();
    addRandomTile();
    render();
  }

  window.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key]) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  let touchStartX = 0, touchStartY = 0;
  tilesEl?.addEventListener?.('touchstart', () => {});
  document.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  restartBtn.addEventListener('click', restart);
  window.addEventListener('resize', () => { measure(); render(); });

  buildBackground();
  setTimeout(() => { restart(); }, 50);
</script>
</body>
</html>
